<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Product details – Hindustan IceCream"/>
  <title>Product Details – Hindustan IceCream</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <link rel="stylesheet" href="css/theme.css"/>
  <link rel="stylesheet" href="css/product-details.css"/>
  <script>
    (function(){
      var t = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

<!-- Loader -->
<div id="pdLoader" class="pd-loader">
  <span style="font-size:44px;filter:drop-shadow(0 0 12px var(--accent-primary));">🍦</span>
  <div class="pd-loader-ring"></div>
</div>

<!-- ── TOP BAR ── -->
<header class="pd-topbar">
  <button class="pd-back-btn" onclick="history.back()" aria-label="Go back">
    <i class="fas fa-arrow-left"></i>
  </button>
  <span class="pd-topbar-title">Product Details</span>
  <button class="pd-cart-topbar-btn" onclick="goToCart()" aria-label="Cart">
    <i class="fas fa-shopping-cart"></i>
    <span class="pd-cart-badge" id="pdCartBadge" style="display:none">0</span>
  </button>
</header>

<!-- ── MAIN ── -->
<main class="pd-main" id="pdMain">

  <!-- SKELETON shown while loading -->
  <div class="pd-skeleton" id="pdSkeleton">
    <div class="pd-skeleton-img skeleton-pulse"></div>
    <div class="pd-skeleton-body">
      <div class="skeleton-line w80 skeleton-pulse"></div>
      <div class="skeleton-line w50 skeleton-pulse"></div>
      <div class="skeleton-line w100 skeleton-pulse"></div>
      <div class="skeleton-line w100 skeleton-pulse"></div>
      <div class="skeleton-line w60 skeleton-pulse"></div>
    </div>
  </div>

  <!-- ACTUAL CONTENT (hidden until loaded) -->
  <div class="pd-content" id="pdContent" style="display:none">

    <!-- ── LEFT: Image Gallery ── -->
    <div class="pd-gallery">
      <div class="pd-main-img-wrap">
        <img id="pdMainImg" src="" alt="Product" class="pd-main-img"/>
        <div class="pd-badge-wrap" id="pdBadgeWrap"></div>
        <!-- zoom hint -->
        <div class="pd-zoom-hint"><i class="fas fa-search-plus"></i> Tap to zoom</div>
      </div>

      <!-- Lightbox -->
      <div class="pd-lightbox" id="pdLightbox" role="dialog" aria-modal="true" aria-label="Image lightbox">
        <button class="pd-lightbox-close" id="pdLightboxClose" aria-label="Close"><i class="fas fa-times"></i></button>
        <img id="pdLightboxImg" src="" alt="Zoomed product"/>
      </div>
    </div>

    <!-- ── RIGHT: Info Panel ── -->
    <div class="pd-info">

      <!-- Category chip -->
      <div class="pd-category-chip" id="pdCategory"></div>

      <!-- Name -->
      <h1 class="pd-name" id="pdName"></h1>

      <!-- Rating row -->
      <div class="pd-rating-row">
        <div class="pd-stars" id="pdStars"></div>
        <span class="pd-rating-val" id="pdRatingVal"></span>
        <span class="pd-reviews" id="pdReviews"></span>
      </div>

      <!-- Price block -->
      <div class="pd-price-block">
        <span class="pd-price" id="pdPrice"></span>
        <span class="pd-mrp"   id="pdMrp"></span>
        <span class="pd-discount-badge" id="pdDiscount"></span>
      </div>

      <!-- Delivery pill -->
      <div class="pd-delivery-pill">
        <i class="fas fa-truck"></i>
        <span id="pdDelivery">Free delivery on orders above ₹199</span>
      </div>

      <!-- Divider -->
      <div class="pd-divider"></div>

      <!-- Description -->
      <div class="pd-section">
        <h3 class="pd-section-title">About this product</h3>
        <p class="pd-desc" id="pdDesc"></p>
      </div>

      <!-- Highlights (if present) -->
      <div class="pd-section" id="pdHighlightsSection" style="display:none">
        <h3 class="pd-section-title">Highlights</h3>
        <ul class="pd-highlights" id="pdHighlights"></ul>
      </div>

      <!-- Quantity selector -->
      <div class="pd-section">
        <h3 class="pd-section-title">Quantity</h3>
        <div class="pd-qty-row">
          <button class="pd-qty-btn" id="pdQtyMinus" aria-label="Decrease quantity">−</button>
          <span class="pd-qty-val" id="pdQtyVal">1</span>
          <button class="pd-qty-btn" id="pdQtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>

      <!-- CTA buttons -->
      <div class="pd-cta-row">
        <button class="pd-btn-cart" id="pdAddToCart">
          <i class="fas fa-shopping-cart"></i> Add to Cart
        </button>
        <button class="pd-btn-buy" id="pdBuyNow">
          ⚡ Buy Now
        </button>
      </div>

      <!-- Divider -->
      <div class="pd-divider"></div>

      <!-- Trust badges -->
      <div class="pd-trust-row">
        <div class="pd-trust-item"><span>🛡️</span><span>100% Genuine</span></div>
        <div class="pd-trust-item"><span>🚚</span><span>Fast Delivery</span></div>
        <div class="pd-trust-item"><span>↩️</span><span>Easy Returns</span></div>
        <div class="pd-trust-item"><span>❄️</span><span>Cold Chain</span></div>
      </div>

    </div><!-- /pd-info -->

  </div><!-- /pd-content -->

  <!-- ERROR STATE -->
  <div class="pd-error" id="pdError" style="display:none">
    <div style="font-size:56px;margin-bottom:16px;">😢</div>
    <h2>Product not found</h2>
    <p>This item might be unavailable or the link is incorrect.</p>
    <button class="pd-btn-buy" onclick="history.back()" style="margin-top:20px;max-width:200px">
      ← Go Back
    </button>
  </div>

</main>

<!-- Global toast (reused) -->
<div id="globalToast" class="global-toast"></div>

<script src="js/api.js"></script>
<script src="js/product-details.js"></script>
</body>
</html>
